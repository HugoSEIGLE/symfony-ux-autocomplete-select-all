<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Symfony UX Autocomplete Select All demo</title>
  <desc id="desc">A multiple autocomplete field with selected European countries and a Clear selection button.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4eafd"/>
      <stop offset="0.48" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#eef1f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#1f2a44" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <rect x="160" y="72" width="880" height="531" rx="24" fill="#fff" stroke="#dce3ed" filter="url(#shadow)"/>
  <text x="226" y="139" fill="#5b6ee1" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">SYMFONY UX BUNDLE</text>
  <text x="226" y="198" fill="#182230" font-family="Arial, sans-serif" font-size="44" font-weight="700">Select every option. Instantly.</text>
  <text x="226" y="238" fill="#5f6b7a" font-family="Arial, sans-serif" font-size="18">One controller, every autocomplete page, one Tom Select instance.</text>
  <text x="226" y="315" fill="#182230" font-family="Arial, sans-serif" font-size="17" font-weight="700">European Union countries</text>
  <rect x="786" y="282" width="188" height="44" rx="8" fill="#fff" stroke="#e8a5a5"/>
  <text x="814" y="309" fill="#b53232" font-family="Arial, sans-serif" font-size="15" font-weight="700">Clear selection</text>
  <rect x="226" y="344" width="748" height="92" rx="12" fill="#fff" stroke="#cfd7e3" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="244" y="362" width="94" height="34" rx="6" fill="#eef0ff"/><text x="260" y="384" fill="#4355c5">Austria ×</text>
    <rect x="348" y="362" width="104" height="34" rx="6" fill="#eef0ff"/><text x="364" y="384" fill="#4355c5">Belgium ×</text>
    <rect x="462" y="362" width="105" height="34" rx="6" fill="#eef0ff"/><text x="478" y="384" fill="#4355c5">Bulgaria ×</text>
    <rect x="577" y="362" width="96" height="34" rx="6" fill="#eef0ff"/><text x="593" y="384" fill="#4355c5">Croatia ×</text>
    <rect x="683" y="362" width="91" height="34" rx="6" fill="#eef0ff"/><text x="699" y="384" fill="#4355c5">Cyprus ×</text>
    <rect x="784" y="362" width="98" height="34" rx="6" fill="#eef0ff"/><text x="800" y="384" fill="#4355c5">Czechia ×</text>
    <text x="897" y="384" fill="#778295">+21</text>
  </g>
  <text x="226" y="478" fill="#778295" font-family="Arial, sans-serif" font-size="15">All 27 results loaded across three API pages.</text>
  <circle cx="238" cy="531" r="8" fill="#52b788"/>
  <text x="258" y="537" fill="#384454" font-family="Arial, sans-serif" font-size="15">AssetMapper · Symfony 6.4 · Stimulus 3</text>
</svg>
