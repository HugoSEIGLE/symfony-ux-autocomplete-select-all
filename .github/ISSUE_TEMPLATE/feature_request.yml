name: Feature request
description: Suggest a backwards-compatible improvement.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user problem would this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and public API.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Which workarounds or alternatives have you considered?

  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: This proposal preserves Symfony UX Autocomplete ownership of Tom Select.
          required: true
