name: Stale

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: >
            This issue has had no activity for 60 days. Add relevant information
            or confirm that it is still reproducible to keep it open.
          close-issue-message: >
            This issue was closed after 14 additional days without activity.
            Feel free to open a new issue with an up-to-date reproducer.
          stale-pr-message: >
            This pull request has had no activity for 60 days. Please rebase it
            and confirm that you would still like to continue.
          close-pr-message: >
            This pull request was closed after 14 additional days without
            activity. It can be reopened when work resumes.
          exempt-issue-labels: security,pinned
          exempt-pr-labels: security,pinned
