name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer:
    name: Composer validation and security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - run: composer audit

  php:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / UX ${{ matrix.ux }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            symfony: '6.4.*'
            ux: '^2.17'
          - php: '8.2'
            symfony: '7.4.*'
            ux: '^3.0'
          - php: '8.3'
            symfony: '7.4.*'
            ux: '^3.0'
          - php: '8.4'
            symfony: '8.0.*'
            ux: '^3.0'
          - php: '8.5'
            symfony: '8.1.*'
            ux: '^3.0'
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
          UX_REQUIRE: ${{ matrix.ux }}
        run: |
          composer update --prefer-dist --no-progress --with-all-dependencies \
            --with "symfony/asset-mapper:${SYMFONY_REQUIRE}" \
            --with "symfony/dependency-injection:${SYMFONY_REQUIRE}" \
            --with "symfony/framework-bundle:${SYMFONY_REQUIRE}" \
            --with "symfony/http-kernel:${SYMFONY_REQUIRE}" \
            --with "symfony/stimulus-bundle:${UX_REQUIRE}" \
            --with "symfony/ux-autocomplete:${UX_REQUIRE}"
      - name: PHPUnit
        run: composer test

  php-cs:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-progress
      - run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress
      - run: composer phpstan

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: composer install --prefer-dist --no-progress
      - run: npm ci
      - run: mkdir -p coverage/php
      - name: PHP coverage
        run: composer test -- --coverage-clover coverage/php/clover.xml
      - name: JavaScript coverage
        run: npm run test:coverage
      - name: Upload PHP coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage/php/clover.xml
          flags: php
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload JavaScript coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage/javascript/cobertura-coverage.xml
          flags: javascript
          fail_ci_if_error: true
          use_oidc: true

  demo:
    name: Demo application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress
      - run: composer audit
      - run: php bin/console lint:container
      - run: php bin/console lint:twig templates
      - run: php bin/console debug:asset-map
